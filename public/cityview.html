<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HANPAN 도시 맵 확인</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d3dc; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; color: #eef1f3; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; } canvas:active { cursor: grabbing; }
  #panel { position: fixed; left: 12px; top: 12px; width: 268px; padding: 12px 14px; background: rgba(18, 22, 26, .84); border-radius: 8px; }
  h1 { margin: 0 0 6px; font-size: 16px; } pre { margin: 0 0 10px; font: 13px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 5px 10px; margin: 0 4px 4px 0; border: 0; border-radius: 5px; background: #39444d; color: inherit; cursor: pointer; }
  button:hover { background: #4b5963; } button:focus-visible { outline: 2px solid #ffd24a; } button[aria-pressed=true] { background: #b4622a; }
  #help { margin: 6px 0 0; font-size: 12px; color: #b9c3ca; }
  .osm { position: fixed; right: 0; bottom: 0; padding: 2px 8px; background: rgba(255, 255, 255, .82); color: #16324a; font-size: 12px; text-decoration: none; } .osm:hover { text-decoration: underline; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1 id="name">불러오는 중</h1>
  <pre id="stat"></pre>
  <div>
    <button id="street">거리</button><button id="shops">매장</button><button id="alley">골목</button><button id="cross">교차로</button><button id="bird">조감</button><button id="top">위에서</button><button id="guess" aria-pressed="false">기본값 높이 표시</button><button id="bench">성능 측정</button>
  </div>
  <p id="help">드래그로 시점, WASD 이동, Q/E 높이, Shift 빠르게</p>
</div>
<script type="module" src="cityview.js"></script>
</body>
</html>
